[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-claims-platform"
version = "0.1.0"
description = "Hybrid healthcare claims document-processing platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "redis>=5.0",
    "aiokafka>=0.11",
    "pillow>=10.3",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "structlog>=24.1",
    # The services honor HTTP(S)/ALL_PROXY through httpx.  Declare the SOCKS
    # transport so importing a service cannot fail when ALL_PROXY uses socks5.
    "httpx[socks]>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Optional extras. Florence-2 and GOT-OCR2 are MUTUALLY EXCLUSIVE profiles:
# florence pins transformers==4.46.3 while got_ocr2 requires transformers>=4.57.
# Never install both into one Python environment. Prefer a single runtime-*
# profile per deployable image (see docs/RUNTIME_PROFILES.md and
# requirements/runtime-*.txt). One env cannot install all model families.
# ---------------------------------------------------------------------------
ocr = [
    "rapidocr-onnxruntime>=1.3,<2",
    "onnxruntime>=1.17,<2",
    # Pinned below 3.0: paddleocr 3.x is a different pipeline (PP-OCRv6,
    # multi-stage with auto-downloaded models) with a changed constructor
    # API (`show_log` removed, `use_angle_cls` renamed) and, on this host,
    # a paddlepaddle CPU/oneDNN inference crash
    # (`ConvertPirAttribute2RuntimeAttribute not support ...DoubleAttribute`)
    # on the newer model architecture. `PaddleOCRTextExtractor` targets the
    # simpler, stable 2.x `.ocr(img, cls=True)` det+rec API.
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6,<3",
]
handwriting = [
    "torch>=2.2",
    "transformers>=4.40,<5",
    "sentencepiece>=0.2",
]
learned-match = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lightglue @ git+https://github.com/cvg/LightGlue.git",
]
# EXCLUSIVE vs got_ocr2 — transformers==4.46.3 conflicts with got_ocr2's >=4.57.
florence = [
    "einops>=0.8",
    "timm>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers==4.46.3",
]
# EXCLUSIVE vs florence — transformers>=4.57 conflicts with florence's ==4.46.3.
got_ocr2 = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.57,<5",
]
docling = [
    "docling>=2.70,<3",
]
ml = [
    # Intentionally omits florence and got_ocr2 (mutually exclusive).
    "idp-claims-platform[ocr,handwriting]",
]
router-ml-training = [
    "lightgbm>=4.6,<5",
    "xgboost>=3.0,<4",
    "scikit-learn>=1.7,<2",
    "joblib>=1.5,<2",
]
# Dev tooling only — must NOT pull florence and got_ocr2 together (or either).
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "psutil>=6.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
# Runtime install profiles (one profile per environment / image).
runtime-core = []
runtime-handwriting = [
    "idp-claims-platform[handwriting]",
]
runtime-florence = [
    "idp-claims-platform[florence]",
]
runtime-got-ocr2 = [
    "idp-claims-platform[got_ocr2]",
]
runtime-learned-match = [
    "idp-claims-platform[learned-match]",
]
# Cloud residual adapters use httpx/tenacity from core; no extra pins unless
# a future Azure SDK is required.
runtime-cloud-residual = []

[project.scripts]
idp-evaluate = "evaluation.runner:main"
idp-production-report = "evaluation.generate_production_report:main"
idp-source-readiness = "evaluation.source_readiness:main"
idp-qualify-vnext = "scripts.qualify_vnext:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*", "workers*", "evaluation*", "scripts*", "datasets*"]
exclude = ["tests*", "dataset_raw*", "deploy*", "docs*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "workers", "packages"]
asyncio_mode = "auto"
markers = [
    "golden: byte-for-byte fixed-width golden comparisons",
    "integration: requires docker-compose services",
    "performance: throughput/latency harness, not run in normal CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` default-argument pattern is idiomatic and
#   intentional, not the footgun this rule targets.
# TRY004: `_reject_bytes` raising ValueError for a disallowed payload shape
#   is a value-validation error, not a type-call error.
ignore = ["B008", "TRY004"]
